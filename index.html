<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The personal website of Le Viet Duc.">
  <meta name="theme-color" content="#ffffff">
  <title>Le Viet Duc</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --foreground: #171717;
      --muted: #666666;
      --surface: #fafafa;
      --ring: rgba(0, 0, 0, 0.09);
      --focus: #0072f5;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--foreground);
      font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-feature-settings: "liga" 1;
      text-rendering: optimizeLegibility;
    }

    a { color: inherit; }

    .shell {
      width: min(100% - 40px, 1040px);
      margin: 0 auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      letter-spacing: -0.3px;
      text-decoration: none;
    }

    .mark::before {
      content: "";
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-bottom: 14px solid currentColor;
    }

    nav a,
    .button {
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }

    nav a:hover { text-decoration: underline; text-underline-offset: 4px; }

    main {
      min-height: calc(100vh - 144px);
      display: grid;
      align-content: center;
      padding: 80px 0 120px;
    }

    .eyebrow {
      width: fit-content;
      margin: 0 0 24px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--surface);
      box-shadow: 0 0 0 1px var(--ring);
      color: var(--muted);
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 12px;
      font-weight: 500;
    }

    h1 {
      max-width: 820px;
      margin: 0;
      font-size: clamp(52px, 9vw, 104px);
      font-weight: 600;
      letter-spacing: clamp(-5px, -0.05em, -2.6px);
      line-height: 0.93;
    }

    .intro {
      max-width: 660px;
      margin: 32px 0 0;
      color: var(--muted);
      font-size: clamp(18px, 2vw, 21px);
      line-height: 1.65;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 40px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 7px;
      box-shadow: 0 0 0 1px var(--ring), 0 2px 2px rgba(0, 0, 0, 0.04);
      transition: transform 160ms ease, box-shadow 160ms ease;
    }

    .button.primary {
      background: var(--foreground);
      color: var(--background);
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 0 1px var(--ring), 0 5px 14px rgba(0, 0, 0, 0.08);
    }

    .button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
      color: var(--muted);
      font-family: "Geist Mono", ui-monospace, monospace;
      font-size: 12px;
      box-shadow: 0 -1px 0 var(--ring);
    }

    @media (max-width: 600px) {
      .shell { width: min(100% - 32px, 1040px); }
      main { padding: 64px 0 88px; }
      .actions { flex-direction: column; }
      .button { width: 100%; }
      footer { align-items: flex-start; flex-direction: column; justify-content: center; gap: 6px; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0a0a0a;
        --foreground: #ededed;
        --muted: #a1a1a1;
        --surface: #171717;
        --ring: rgba(255, 255, 255, 0.14);
      }
      meta[name="theme-color"] { color: #0a0a0a; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .button { transition: none; }
    }
  </style>
</head>
<body>
  <header class="shell">
    <a class="mark" href="/" aria-label="Le Viet Duc — home">Le Viet Duc</a>
    <nav aria-label="Primary navigation">
      <a href="https://github.com/duclvq" rel="me">GitHub ↗</a>
    </nav>
  </header>

  <main class="shell">
    <div>
      <p class="eyebrow">HELLO, WORLD.</p>
      <h1>I build ideas into working systems.</h1>
      <p class="intro">
        I’m Le Viet Duc. This is my new home on the web—a place for projects,
        experiments, and notes. More is on the way.
      </p>
      <div class="actions">
        <a class="button primary" href="https://github.com/duclvq" rel="me">View my GitHub</a>
        <a class="button" href="https://github.com/duclvq?tab=repositories">Explore repositories</a>
      </div>
    </div>
  </main>

  <footer class="shell">
    <span>© <span id="year"></span> Le Viet Duc</span>
    <span>duclvq.github.io</span>
  </footer>

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
